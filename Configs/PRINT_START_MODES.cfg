[gcode_macro PRINT_END]
description: Print End Macro
gcode:
 G91
 G1 Z+15 F5000
 M107
 M104 S148 T0
 M104 S0 T1
 G91
 G1 E-5 F3000
 G90
 _PARK_TOOL
 G92 E0
 M107
 #SET_SKEW CLEAR=1
 SET_DUAL_CARRIAGE CARRIAGE=0
 SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
 SET_GCODE_OFFSET Z=0
 SET_LED_EFFECT EFFECT=filament_gradient_R STOP=1
 SET_LED_EFFECT EFFECT=filament_gradient_L STOP=1
 SET_LED_EFFECT EFFECT=Rainbow_BED


