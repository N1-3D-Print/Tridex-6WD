########################################
# Extruder 1 (T1) - Right
########################################
[extruder1]
step_pin: EBBCan1: PD0
dir_pin: !EBBCan1: PD1
enable_pin: !EBBCan1: PD2
microsteps: 32
rotation_distance: 22
gear_ratio: 50:8
nozzle_diameter: 0.500
filament_diameter: 1.750
heater_pin: EBBCan1: PB13
sensor_type: PT1000
sensor_pin: EBBCan1: PA3
#control: pid
#pid_Kp: 20.552
#pid_Ki: 0.778
#pid_Kd: 135.653
min_temp: 0
max_temp: 400
min_extrude_temp: 10
max_power: 1.0
smooth_time: 1.0
#pressure_advance: 0.025
#pressure_advance_smooth_time: 0.03
max_extrude_only_distance: 250
max_extrude_cross_section: 250
max_extrude_only_velocity: 100

pressure_advance_model: tanh
linear_advance: 0.02
nonlinear_offset: 0.1
linearization_velocity: 2
pressure_advance_smooth_time: 0.02
pressure_advance_time_offset: 0

[verify_heater extruder1]
max_error: 6000
check_gain_time: 9999999
hysteresis: 50
heating_gain: 0.01

[tmc2209 extruder1]
uart_pin: EBBCan1: PA15
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Fan Control
#####################################################################
[fan_generic partfan_t1]
###  Print Cooling Fan
pin: MMB_Cubic: gpio7 #EBBCan1: PA0
shutdown_speed: 0 
cycle_time: 0.005 
kick_start_time: 0.150
