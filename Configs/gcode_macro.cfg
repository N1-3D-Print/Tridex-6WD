[gcode_macro Power]
gcode:
  SET_TMC_CURRENT STEPPER=x CURRENT=3
  SET_TMC_CURRENT STEPPER=x1 CURRENT=3
  SET_TMC_CURRENT STEPPER=u CURRENT=3
  SET_TMC_CURRENT STEPPER=u1 CURRENT=3
  SET_TMC_CURRENT STEPPER=y CURRENT=3
  SET_TMC_CURRENT STEPPER=y1 CURRENT=3

