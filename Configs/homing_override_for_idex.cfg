[homing_override]
axes: xyz
gcode:
  STOP_LED_EFFECTS

  {% set x_center = 125 %}
  {% set y_center = 125 %}
  {% set printing = printer.print_stats.state in ["printing", "paused"] %}

  # ---------------------------------------
  # T0 Home Retract Settings
  # ---------------------------------------
  {% set t0_home_retract = 5.0 %}      # mm vom linken Endstop weg (+X)
  {% set t0_retract_feed = 30000 %}    # Feedrate

  # T1 X-Max ist fix 295 -> Parken auf X=290
  {% set t1_xmax = 290 %}
  {% set t1_target = t1_xmax - 5.0 %}

  # ---------------------------------------
  # Y Current Settings (optional Sensorless)
  # ---------------------------------------
  {% set y_run_current   = 2.50 %}
  {% set y1_run_current  = 2.50 %}
  {% set y_home_current  = 0.9 %}
  {% set y1_home_current = 0.9 %}

  SET_STEPPER_ENABLE STEPPER="stepper y" ENABLE=1
  SET_STEPPER_ENABLE STEPPER="stepper y1" ENABLE=1

  G4 P750
  G90

  # ==========================================================
  # NUR X HOMEN
  # ==========================================================
  {% if 'X' in params and 'Y' not in params and 'Z' not in params %}

    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SET_LED_EFFECT EFFECT=homing FADETIME=1.0
    G28 X
    SET_LED_EFFECT EFFECT=LED_White FADETIME=1.0

    # T1 parken
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X{t1_target} F30000

    # T0 retract vom Endstop
    G91
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X{t0_home_retract} F{t0_retract_feed}
    G90

    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY


  # ==========================================================
  # NUR Y HOMEN
  # ==========================================================
  {% elif 'Y' in params and 'X' not in params and 'Z' not in params %}

    SET_LED_EFFECT EFFECT=homing FADETIME=1.0
    G28 Y
    G1 Y{y_center} F30000
    SET_LED_EFFECT EFFECT=LED_White FADETIME=1.0


  # ==========================================================
  # NUR Z HOMEN
  # ==========================================================
  {% elif 'Z' in params and 'X' not in params and 'Y' not in params %}

    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY

    {% if not printing and 'x' in printer.toolhead.homed_axes|lower and 'y' in printer.toolhead.homed_axes|lower %}
      G1 X{x_center} Y{y_center} F30000
    {% endif %}

    SET_LED_EFFECT EFFECT=homing FADETIME=1.0
    G28 Z
    SET_LED_EFFECT EFFECT=LED_White FADETIME=1.0
    G1 Z30 F30000


  # ==========================================================
  # X + Y HOMEN
  # ==========================================================
  {% elif 'X' in params and 'Y' in params and 'Z' not in params %}

    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SET_LED_EFFECT EFFECT=homing FADETIME=1.0
    G28 X
    SET_LED_EFFECT EFFECT=LED_White FADETIME=1.0

    # T1 parken
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X{t1_target} F30000

    # T0 retract
    G91
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X{t0_home_retract} F{t0_retract_feed}
    G90

    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY

    SET_LED_EFFECT EFFECT=homing FADETIME=1.0
    G28 Y
    G1 Y{y_center} F30000
    SET_LED_EFFECT EFFECT=LED_White FADETIME=1.0


  # ==========================================================
  # HOME ALL (G28)
  # ==========================================================
  {% else %}

    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SET_LED_EFFECT EFFECT=homing FADETIME=1.0
    G28 X
    SET_LED_EFFECT EFFECT=LED_White FADETIME=1.0

    # T1 parken
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X{t1_target} F30000

    # T0 retract
    G91
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X{t0_home_retract} F{t0_retract_feed}
    G90

    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY

    SET_LED_EFFECT EFFECT=homing FADETIME=1.0
    G28 Y
    G1 Y{y_center} F30000
    SET_LED_EFFECT EFFECT=LED_White FADETIME=1.0

    G1 X{x_center} Y{y_center} F30000

    SET_LED_EFFECT EFFECT=homing FADETIME=1.0
    G28 Z
    SET_LED_EFFECT EFFECT=LED_White FADETIME=1.0
    G1 Z30 F30000

    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=LED_Nightrider FADETIME=1.0
    SET_LED_EFFECT EFFECT=Rainbow_BED FADETIME=1.0

  {% endif %}
