[duplicate_pin_override]
pins: PC5
# following add pseudo filament sensor to controll nudge sensor
[filament_switch_sensor Nudge_Sensor]
switch_pin: PC5
pause_on_runout: FALSE
runout_gcode:
    # M118 Nudge Touched!
insert_gcode:
    # M118 Nudge Not Pressed!
