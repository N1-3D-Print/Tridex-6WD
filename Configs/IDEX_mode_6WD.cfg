
[save_variables]
filename: ~/printer_data/config/idex-variables.cfg

[gcode_macro DC_VARS]
# Variables for safe homing, set to z_endstop location pin OR safe location when using TAP
variable_homing_safe_x: 125
variable_homing_safe_y: 125
variable_homing_feedrate: 10000

# Distance from end of axis to park the tool head, needed for x/y offsets, default: 3
variable_park_distance: 1 #4.5

# Copy and mirror mode start location for T0, T1 start will be calculated off these values
# This position is where to start the syncronization between the tool heads.
# I recommend placing it near the ending location for your T0 purge.
variable_copy_start_x: 5
variable_copy_start_y: 5
variable_copy_start_z: 5

# Print cooling fans names
variable_fan0: 'partfan_t0'
variable_fan1: 'partfan_t1'
#variable_fan2: 'Aux_Fan'

## Autopark parameters
## default autopark: 0:inactive - 1:active
variable_autopark: 1
variable_z_hop: 2
variable_movespeed: 1500
variable_feedrate: 6000000000

# Nozzle Scrub / Purge
variable_scrub: 1
variable_scrubs: 5
variable_prep_spd_xy: 32000
variable_purge_length: 0
variable_purge_spd: 150
variable_purge_ret: 0
variable_ooze_dwell: 1
variable_purge_temp_min: 200

variable_offset_x: 0.0
variable_offset_y: 0.0
variable_offset_z: 0.0

variable_swap_toolheads: 0
variable_immediate_move: 1

variable_t0_copy_mirror_temp_start: 0
variable_t1_copy_mirror_temp_start: 0
variable_t0_copy_mirror_temp_print: 0
variable_t1_copy_mirror_temp_print: 0

gcode:

[respond]

#####################################################################
# Swap Velocity Limits (ACCEL / SCV / optional MINIMUM_CRUISE_RATIO)
#####################################################################

[gcode_macro _SWAP_LIMITS_CFG]
description: Config holder for swap limits
variable_swap_accel: 60000
variable_swap_scv: 150
variable_swap_mcr: 0.0
gcode:

[gcode_macro _SWAP_LIMITS_STORE]
description: Store current velocity limits for swap
variable_accel: 0.0
variable_scv: 0.0
variable_mcr: 0.0
gcode:
  {% set accel = printer.toolhead.max_accel|float %}
  {% set scv   = printer.toolhead.square_corner_velocity|float %}
  {% set mcr_supported = (printer.toolhead.minimum_cruise_ratio is defined) %}
  {% set mcr   = (printer.toolhead.minimum_cruise_ratio|float) if mcr_supported else 0.0 %}

  SET_GCODE_VARIABLE MACRO=_SWAP_LIMITS_STORE VARIABLE=accel VALUE={accel}
  SET_GCODE_VARIABLE MACRO=_SWAP_LIMITS_STORE VARIABLE=scv   VALUE={scv}
  SET_GCODE_VARIABLE MACRO=_SWAP_LIMITS_STORE VARIABLE=mcr   VALUE={mcr}


[gcode_macro _SWAP_LIMITS_APPLY]
description: Apply swap limits (SCV high, MCR 0 if supported)
gcode:
  {% set cfg = printer["gcode_macro _SWAP_LIMITS_CFG"] %}
  {% set mcr_supported = (printer.toolhead.minimum_cruise_ratio is defined) %}
  # Always set ACCEL + SCV
  SET_VELOCITY_LIMIT ACCEL={cfg.swap_accel|float} SQUARE_CORNER_VELOCITY={cfg.swap_scv|float}
  # Only set MCR if this Klipper build supports it
  {% if mcr_supported %}
    SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={cfg.swap_mcr|float}
  {% endif %}

[gcode_macro _SWAP_LIMITS_RESTORE]
description: Restore stored velocity limits after swap
gcode:
  {% set v = printer["gcode_macro _SWAP_LIMITS_STORE"] %}
  {% set mcr_supported = (printer.toolhead.minimum_cruise_ratio is defined) %}
  # Always restore ACCEL + SCV
  SET_VELOCITY_LIMIT ACCEL={v.accel|float} SQUARE_CORNER_VELOCITY={v.scv|float}
  # Only restore MCR if supported
  {% if mcr_supported %}
    SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={v.mcr|float}
  {% endif %}

[gcode_macro SWAP_LIMITS_START]
gcode:
  _SWAP_LIMITS_STORE
  _SWAP_LIMITS_APPLY

[gcode_macro SWAP_LIMITS_END]
gcode:
  _SWAP_LIMITS_RESTORE

#####################################################################
#   T0 macro
#   In PRIMARY mode activates tool 0, parks tool 1 if enabled.
#####################################################################

[gcode_macro T0]
description: Activate T0 in "FULL_CONTROL" or "AUTO-PARK"
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set do_scrub = dcvars.scrub|int %}
    {% if printer.dual_carriage is defined %}
        {% if printer.dual_carriage.carriage_0 == "INACTIVE" %}
            # If the printer isn't homed, just change over to the other tool head.
            # This makes loading filament and purging a little easier.
            {% if "xyz" not in printer.toolhead.homed_axes %}
                ACTIVATE_EXTRUDER EXTRUDER=extruder
                SET_DUAL_CARRIAGE CARRIAGE=x
            {% else %}
                # z-hop
                {% if dcvars.z_hop|float > 0.0 %}
                    {% set max_z = printer.toolhead.axis_maximum.z|float %}
                    {% set cur_z = printer.toolhead.position.z|float %}
                    {% set z_safe = dcvars.z_hop|float if cur_z < (max_z - dcvars.z_hop|float) else (max_z - cur_z) %}
                    G91
                    G1 Z{z_safe}
                    G90
                {% endif %}

                {% if dcvars.swap_toolheads == 1 %}
                    SAVE_GCODE_STATE NAME=swap_state
                    RESPOND TYPE=echo MSG="Swap Change"
                    _SWAP_T0
                    RESTORE_GCODE_STATE NAME=swap_state
                {% else %}
                    RESPOND TYPE=echo MSG="Classic Change"
                    {% if dcvars.autopark == 1 %}
                        SAVE_GCODE_STATE NAME=toolhead_state
                        _PARK_TOOL
                    {% endif %}

                    ACTIVATE_EXTRUDER EXTRUDER=extruder
                    SET_DUAL_CARRIAGE CARRIAGE=x

                    {% if do_scrub == 1 %}
                        _NOZZLE_SCRUB
                    {% endif %}

                    {% if dcvars.autopark == 1 %}
                        RESTORE_GCODE_STATE NAME=toolhead_state MOVE={dcvars.immediate_move} MOVE_SPEED={dcvars.movespeed}
                    {% endif %}
                {% endif %}

                # restore z
                {% if (z_safe) is defined %}
                    G91
                    G1 Z-{z_safe}
                    G90
                {% endif %}

                # Set absolute tool offsets for T0
                SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=1

                # print fan speed
                _SET_PRINT_FANS_SPEED
            {% endif %}
        {% endif %}
    {% endif %}

#####################################################################
#   _SWAP_T0 macro
#   Change to T0 via quick swap
#   Ported from Helge Keck's Vcore IDEX macros.
#####################################################################

[gcode_macro _SWAP_T0]
description: Perform toolhead swap for T0
gcode:
    SWAP_LIMITS_START
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set t0_curr_pos = printer.configfile.config["carriage x"].position_min|float + dcvars.park_distance %}
    {% set t1_curr_pos = printer.gcode_move.gcode_position.x|float %}
    {% set t0_new_x = t1_curr_pos %}
    {% set t1_new_x = printer.configfile.config["dual_carriage u"].position_max|float - dcvars.park_distance %}
    {% set t0_distance = t0_new_x - t0_curr_pos %}
    {% set t1_distance = t1_new_x - t1_curr_pos %}
    {% if t0_distance >= t1_distance %}
        SET_DUAL_CARRIAGE CARRIAGE=u MODE=COPY
        G0 X{t0_curr_pos + (t1_distance)} F{dcvars.feedrate}
        SET_DUAL_CARRIAGE CARRIAGE=u MODE=PRIMARY
        SET_DUAL_CARRIAGE CARRIAGE=x MODE=PRIMARY
        G0 X{t0_new_x} F{dcvars.feedrate}
    {% elif t0_distance < t1_distance %}
        SET_DUAL_CARRIAGE CARRIAGE=u MODE=COPY
        G0 X{t0_new_x} F{dcvars.feedrate}
        SET_DUAL_CARRIAGE CARRIAGE=u MODE=PRIMARY
        G0 X{t1_new_x} F{dcvars.feedrate}
        SET_DUAL_CARRIAGE CARRIAGE=x MODE=PRIMARY
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SWAP_LIMITS_END
    
#####################################################################
#   T1 macro
#   In PRIMARY mode activates tool 1, parks tool 0 if enabled.
#####################################################################

[gcode_macro T1]
description: Activate T1 in "FULL_CONTROL" or "AUTO-PARK"
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set do_scrub = dcvars.scrub|int %}
    {% if printer.dual_carriage is defined %}
        {% if printer.dual_carriage.carriage_1 == "INACTIVE" %}
            # If the printer isn't homed, just change over to the other tool head.
            # This makes loading filament and purging a little easier.
            {% if "xyz" not in printer.toolhead.homed_axes %}
                ACTIVATE_EXTRUDER EXTRUDER=extruder1
                SET_DUAL_CARRIAGE CARRIAGE=u
            {% else %}
                # z-hop
                {% if dcvars.z_hop|float > 0.0 %}
                    {% set max_z = printer.toolhead.axis_maximum.z|float %}
                    {% set cur_z = printer.toolhead.position.z|float %}
                    {% set z_safe = dcvars.z_hop|float if cur_z < (max_z - dcvars.z_hop|float) else (max_z - cur_z) %}
                    G91
                    G1 Z{z_safe}
                    G90
                {% endif %}

                {% if dcvars.swap_toolheads == 1 %}
                    SAVE_GCODE_STATE NAME=swap_state
                    RESPOND TYPE=echo MSG="T1 Swap Change"
                    _SWAP_T1
                    RESTORE_GCODE_STATE NAME=swap_state
                {% else %}
                    RESPOND TYPE=echo MSG="Classic Change"
                    {% if dcvars.autopark == 1 %}
                        SAVE_GCODE_STATE NAME=toolhead_state
                        _PARK_TOOL
                    {% endif %}

                    ACTIVATE_EXTRUDER EXTRUDER=extruder1
                    SET_DUAL_CARRIAGE CARRIAGE=u

                    {% if do_scrub == 1 %}
                        _NOZZLE_SCRUB
                    {% endif %}

                    {% if dcvars.autopark == 1 %}
                        RESTORE_GCODE_STATE NAME=toolhead_state MOVE={dcvars.immediate_move} MOVE_SPEED={dcvars.movespeed}
                    {% endif %}
                {% endif %}

                # restore z
                {% if (z_safe) is defined %}
                    G91
                    G1 Z-{z_safe}
                    G90
                {% endif %}

                # Set absolute tool offsets for T1
                SET_GCODE_OFFSET X={dcvars.offset_x|round(3)} Y={dcvars.offset_y|round(3)} Z={dcvars.offset_z|round(3)} MOVE=1

                # print fan speed
                _SET_PRINT_FANS_SPEED
            {% endif %}
        {% endif %}
    {% endif %}


#####################################################################
#   _SWAP_T1 macro
#   Change to T1 via quick swap
#   Ported from Helge Keck's Vcore IDEX macros
#####################################################################

[gcode_macro _SWAP_T1]
description: Perform toolhead swap for T1
gcode:
    SWAP_LIMITS_START
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set t0_curr_pos = printer.gcode_move.gcode_position.x|float %}
    {% set t1_curr_pos = printer.configfile.config["dual_carriage u"].position_max|float - dcvars.park_distance %}
    {% set t0_new_x = printer.configfile.config["carriage x"].position_min|float + dcvars.park_distance %}
    {% set t1_new_x = t0_curr_pos %}
    {% set t0_distance = (t0_curr_pos - t0_new_x) %}
    {% set t1_distance = (t1_curr_pos - t1_new_x) %}

    {% if t0_distance >= t1_distance %}
        SET_DUAL_CARRIAGE CARRIAGE=u MODE=COPY
        G0 X{t0_curr_pos - t1_distance} F{dcvars.feedrate}
        SET_DUAL_CARRIAGE CARRIAGE=x MODE=PRIMARY
        G0 X{t0_new_x} F{dcvars.feedrate}
        SET_DUAL_CARRIAGE CARRIAGE=u MODE=PRIMARY
    {% elif t0_distance < t1_distance %}
        SET_DUAL_CARRIAGE CARRIAGE=u MODE=COPY
        G0 X{t0_new_x} F{dcvars.feedrate}
        SET_DUAL_CARRIAGE CARRIAGE=u MODE=PRIMARY
        G0 X{t1_new_x} F{dcvars.feedrate}
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SWAP_LIMITS_END

#####################################################################
#   _PARK_TOOL
#   Parks toolhead at the far end of the axis
#####################################################################

[gcode_macro _PARK_TOOL]
gcode:
    {% if printer.toolhead.extruder == 'extruder' %}
            {% set TEMP_EXT = printer.extruder.temperature %}
            RESPOND MSG="Extruder 1 select"
    {% else %}
            {% set TEMP_EXT = printer.extruder1.temperature %}
            RESPOND MSG="Extruder select"
    {% endif %}       
    {% if TEMP_EXT > 170 %}
        _CLIENT_LINEAR_MOVE E=-3 F=300                  #retract 3mm to reduce ozzing
        RESPOND MSG="Retract 3mm"
    {% endif %}
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% if printer.dual_carriage is defined %}
        SAVE_GCODE_STATE NAME=park_tool
        SET_GCODE_OFFSET X=0 Y=0 Z=0
        G90
        {% if printer.toolhead.extruder == 'extruder' %}
            {% set XPOS = printer.configfile.config["carriage x"].position_min|float + dcvars.park_distance %}
            G1 X{XPOS} F{dcvars.feedrate}
        {% elif (printer.toolhead.extruder) == 'extruder1' %}
            {% set XPOS = printer.configfile.config["dual_carriage u"].position_max|float - dcvars.park_distance %}
            G1 X{XPOS} F{dcvars.feedrate}
        {% else %}
            RESPOND MSG={ "Unknown extruder: %s".format(printer.toolhead.extruder) }
        {% endif %}
        RESPOND MSG="Parking Tool done"
        RESTORE_GCODE_STATE NAME=park_tool
    {% endif %}

#####################################################################
#   _NOZZLE_SCRUB
#   Brushes nozzle across wipers to remove ooze.
#   by dorkscript in #tridex_dev
#####################################################################

[gcode_macro _NOZZLE_SCRUB]
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% if printer.dual_carriage is defined and printer.toolhead.extruder in ['extruder', 'extruder1'] %}
        G90 ; Absolute Positioning.
        {% set MIN = 1 %}
        {% set MAX = 20.0 %}
        {% set T0_MIN = printer.configfile.config["stepper x"].position_min|float + dcvars.park_distance %}
        {% set T1_MIN = printer.configfile.config["dual_carriage u"].position_max|float - dcvars.park_distance %}
        {% if printer.toolhead.extruder == 'extruder' %}
            {% set TEMP = printer.extruder.temperature %}
            {% set XMAX = T0_MIN %}
            {% set XPOS = T0_MIN + (MIN|float) %}
            {% set XPOS1 = T0_MIN + (MAX|float) %}
        {% else %}
            {% set TEMP = printer.extruder1.temperature %}
            {% set XMAX = T1_MIN %}
            {% set XPOS = T1_MIN - (MIN|float) %}
            {% set XPOS1 = T1_MIN - (MAX|float) %}
        {% endif %}
        # If extruder hot enough, purge.
        {% if TEMP >= dcvars.purge_temp_min %}
            G90 ; Absolute Positioning.
            G1 X{XMAX} F{dcvars.prep_spd_xy}
            M83      ; relative mode.
            G1 E{dcvars.purge_length} F{dcvars.purge_spd}
            G1 E-{dcvars.purge_ret} F{dcvars.purge_spd * 5}

            G90 ; Absolute Positioning.
            G1 X{XPOS} F{dcvars.prep_spd_xy}
            G4 P{dcvars.ooze_dwell * 1000} ; pause.
            G92 E0   ; reset extruder.
    
            G90 ; Absolute Positioning.
            G1 X{XPOS1} F{dcvars.prep_spd_xy}
            {% for i in range(dcvars.scrubs) %}
                G1 X{XPOS} F{dcvars.feedrate}
                G1 X{XPOS1} F{dcvars.feedrate}
            {% endfor %}
            G1 X{XPOS} F{dcvars.prep_spd_xy}
        {% endif %}
        G90 ; Absolute Positioning.
    {% endif %}

#####################################################################
#   M605 aka DUAL-CARRIAGES : MODES ACTIVATION
#   Activates the requested mode and moves tools to starting position
#####################################################################

[gcode_macro M605]
description: Set the dual-carriages mode from slicers
gcode:
    {% set mode = params.S|default(1)|int %}
    {% if mode == 0 %}
        SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=autopark VALUE=0
        SET_DUAL_CARRIAGE CARRIAGE=u MODE=PRIMARY
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
        SET_DUAL_CARRIAGE CARRIAGE=x MODE=PRIMARY
    {% elif mode == 1 %}
        # Primary with auto_park
        SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=autopark VALUE=1
        ACTIVATE_PRIMARY_MODE
    {% elif mode == 2 or mode == 5 %}
        # Copy mode
        ACTIVATE_COPY_MODE
    {% elif mode == 3 or mode == 6 %}
        # Mirror mode
        ACTIVATE_MIRROR_MODE
    {% endif %}
    {% if mode == 5 or mode == 6 %}
        RESPOND MSG="Please setup rafts in your slicer"
    {% endif %}

#####################################################################
#   DUAL-CARRIAGES : COPY MODE ACTIVATION
#####################################################################

[gcode_macro ACTIVATE_COPY_MODE]
description: Set the carriages for COPY mode (generic_cartesian x/u)
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set T0_START = dcvars.copy_start_x|float %}
    {% set x_min = printer.configfile.settings["carriage x"].position_min|float %}
    {% set u_max = printer.configfile.settings["dual_carriage u"].position_max|float %}
    {% set T1_START = ((x_min + u_max) / 2.0) + T0_START %}
    SET_DUAL_CARRIAGE CARRIAGE=x MODE=PRIMARY
    G0 X{T0_START} Y{dcvars.copy_start_y} Z{dcvars.copy_start_z} F{dcvars.feedrate}
    SET_DUAL_CARRIAGE CARRIAGE=u MODE=PRIMARY
    G0 X{T1_START} F{dcvars.feedrate}
    SET_DUAL_CARRIAGE CARRIAGE=u MODE=COPY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder

#####################################################################
#   DUAL-CARRIAGES : MIRROR MODE ACTIVATION
#####################################################################

[gcode_macro ACTIVATE_MIRROR_MODE]
description: Set the carriages for MIRROR mode (generic_cartesian x/u)
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set T0_START = dcvars.copy_start_x|float %}
    {% set x_min = printer.configfile.settings["carriage x"].position_min|float %}
    {% set u_max = printer.configfile.settings["dual_carriage u"].position_max|float %}
    {% set mirror_fudge = 2.0 %}
    {% set T1_START = (x_min + u_max + mirror_fudge) - T0_START %}
    SET_DUAL_CARRIAGE CARRIAGE=x MODE=PRIMARY
    G0 X{T0_START} Y{dcvars.copy_start_y} Z{dcvars.copy_start_z} F{dcvars.feedrate}
    SET_DUAL_CARRIAGE CARRIAGE=u MODE=PRIMARY
    G0 X{T1_START} F{dcvars.feedrate}
    SET_DUAL_CARRIAGE CARRIAGE=u MODE=MIRROR
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder

#####################################################################
#   M104 / M109 PRINT TEMPERATURE MANAGEMENT
#   Sync's the printing temperature between the tools
#   and allows for different filament usage on copy / mirror prints
#####################################################################

[gcode_macro M104]
rename_existing: M104.1
description: Orca-friendly M104 for IDEX. In COPY/MIRROR, M104 without T sets both tools.
variable_copy_mirror_lock_same_temp: 1   # 1=both tools get same S in copy/mirror (recommended for Orca)
variable_copy_mirror_sync_off: 1         # 1=if S0 in copy/mirror -> turn both off

gcode:
    {% set s = params.S|default(0)|float %}
    {% set t_provided = 'T' in params %}
    {% set t = (params.T|int) if t_provided else -1 %}
    {% set active_tool = 1 if ('extruder1' in printer.toolhead.extruder) else 0 %}
    {% set in_copy_mirror = (printer.dual_carriage is defined)
        and ((printer.dual_carriage.carriage_1 == 'MIRROR')
          or (printer.dual_carriage.carriage_1 == 'COPY')) %}
    {% if in_copy_mirror and (not t_provided) %}
        {% if s == 0 and (copy_mirror_sync_off|int == 1) %}
            M104.1 S0 T0
            M104.1 S0 T1
        {% else %}
            {% if copy_mirror_lock_same_temp|int == 1 %}
                M104.1 S{s} T0
                M104.1 S{s} T1
            {% else %}
                M104.1 S{s} T0
                M104.1 S{s} T1
            {% endif %}
        {% endif %}
    {% else %}
        # Normal / explicit T
        {% set tgt = t if t != -1 else active_tool %}
        M104.1 S{s} T{tgt}
    {% endif %}

#####################################################################
#   M104 / M109 PRINT TEMPERATURE MANAGEMENT
#   Sync's the printing temperature between the tools
#   and allows for different filament usage on copy / mirror prints
#####################################################################

[gcode_macro M109]
rename_existing: M109.1
description: Simple, reliable M109 for IDEX: respects T0/T1; in COPY/MIRROR and no T waits both. Uses ± tolerance window.
variable_temp_tolerance: 5
gcode:
    {% set tol = temp_tolerance|float %}
    {% set s = params.S|default(0)|float %}
    {% set t_provided = 'T' in params %}
    {% set t = (params.T|int) if t_provided else -1 %}
    {% set active_tool = 1 if ('extruder1' in printer.toolhead.extruder) else 0 %}
    {% set in_copy_mirror = (printer.dual_carriage is defined)
        and ((printer.dual_carriage.carriage_1 == 'MIRROR')
          or (printer.dual_carriage.carriage_1 == 'COPY')) %}
    # Set temp first (same as your working approach)
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        {% if in_copy_mirror and (not t_provided) %}
            # Orca copy/mirror: no T -> wait for BOTH in same window
            TEMPERATURE_WAIT SENSOR=extruder  MINIMUM={s-tol} MAXIMUM={s+tol}
            TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={s-tol} MAXIMUM={s+tol}
        {% else %}
            # Explicit T (dual-color) OR normal mode -> wait only that tool (or active if no T)
            {% set tgt = t if t != -1 else active_tool %}
            {% if tgt == 1 %}
                TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={s-tol} MAXIMUM={s+tol}
            {% else %}
                TEMPERATURE_WAIT SENSOR=extruder  MINIMUM={s-tol} MAXIMUM={s+tol}
            {% endif %}
        {% endif %}
    {% endif %}
    
#####################################################################
#   Writes current offsets to the console
#####################################################################

[gcode_macro display_current_offsets]
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    RESPOND MSG="T1 Z offset is at {dcvars.offset_z}"
    RESPOND MSG="T1 Y offset is at {dcvars.offset_y}"
    RESPOND MSG="T1 X offset is at {dcvars.offset_x}"

#####################################################################
#   Saves the current gcode offsets to the disk to keep them
#   consistent across restarts.
#####################################################################

[gcode_macro save_offsets_to_disk]
description: Saves the current T1 offsets to the disk for restarts
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    SAVE_VARIABLE VARIABLE=t1_offset_x VALUE={dcvars.offset_x|round(3)|float}
    SAVE_VARIABLE VARIABLE=t1_offset_y VALUE={dcvars.offset_y|round(3)|float}
    SAVE_VARIABLE VARIABLE=t1_offset_z VALUE={dcvars.offset_z|round(3)|float}

#####################################################################
#   Automatically loads the current gcode offsets and tool change method
#   from disk at printer startup, to keep them consistent across restarts.
#####################################################################

[delayed_gcode _load_offsets_from_disk]
initial_duration: 3.0
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set load_x_offset = svv.t1_offset_x|float %}
    {% set load_y_offset = svv.t1_offset_y|float %}
    {% set load_z_offset = svv.t1_offset_z|float %}
    SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=offset_x VALUE={load_x_offset}
    SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=offset_y VALUE={load_y_offset}
    SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=offset_z VALUE={load_z_offset}

    {% set tool_change = svv.preferred_tool_change %}
    {% if tool_change == "SWAP" %}
      SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=swap_toolheads VALUE=1
      SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=immediate_move VALUE=1
    {% elif tool_change == "OOZE_PREV" %}
      SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=swap_toolheads VALUE=0
      SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=immediate_move VALUE=0
    {% else %}
      SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=swap_toolheads VALUE=0
      SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=immediate_move VALUE=1
    {% endif %}
    
    UPDATE_DELAYED_GCODE ID=_load_offsets_from_disk DURATION=0

#####################################################################
#   Modify T1 X offset values.
#   The following macros allow tweaking the X offset by 0.1 and
#   0.05 increments. 
#####################################################################

[gcode_macro X_offset_increase01]
description: Increase the gcode offset for X by 0.1mm for T1
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set new_val = dcvars.offset_x + 0.10|round(3) %}
    SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=offset_x VALUE={new_val|round(3)}
    RESPOND MSG="New X offset value: {new_val|round(3)}"
    {% if printer.dual_carriage.carriage_0 == "INACTIVE" %}
        SET_GCODE_OFFSET X_ADJUST=0.10 MOVE=1
    {% endif %}
    SAVE_OFFSETS_TO_DISK

