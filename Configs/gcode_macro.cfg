[gcode_macro UNSAFE_HIGHER_BED25]
description: Hogher the bed 25mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=100
  _CLIENT_LINEAR_MOVE Z=-25 F=3000
  M84

