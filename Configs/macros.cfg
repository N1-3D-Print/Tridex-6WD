
[gcode_macro _PARTFAN_STATE]
description: Stores the requested part cooling speed (0..1)
variable_speed: 0.0
gcode:
  ; state holder only

[gcode_macro _IDEX_STATE]
description: Stores current IDEX mode as int (0=normal/primary, 1=copy, 2=mirror)
variable_mode: 0
gcode:
  ; state holder only

[gcode_macro SET_DUAL_CARRIAGE]
rename_existing: SET_DUAL_CARRIAGE_BASE
description: Wrapper to track MODE for fan routing
gcode:
  {% if params.MODE is defined %}
    {% set m = params.MODE|string|upper %}
    {% if m == "COPY" %}
      SET_GCODE_VARIABLE MACRO=_IDEX_STATE VARIABLE=mode VALUE=1
    {% elif m == "MIRROR" %}
      SET_GCODE_VARIABLE MACRO=_IDEX_STATE VARIABLE=mode VALUE=2
    {% else %}
      # PRIMARY / NORMAL / FULL_CONTROL / AUTO / etc. -> treat as normal
      SET_GCODE_VARIABLE MACRO=_IDEX_STATE VARIABLE=mode VALUE=0
    {% endif %}
  {% endif %}

  SET_DUAL_CARRIAGE_BASE {rawparams}

[gcode_macro M106]
description: Tool-aware part cooling (routes to active tool / or both in COPY/MIRROR)
gcode:
  {% set s = params.S|default(255)|float %}
  {% set spd = (s / 255.0) %}
  SET_GCODE_VARIABLE MACRO=_PARTFAN_STATE VARIABLE=speed VALUE={spd}
  _SET_PRINT_FANS_SPEED

[gcode_macro M107]
description: Tool-aware part cooling off
gcode:
  SET_GCODE_VARIABLE MACRO=_PARTFAN_STATE VARIABLE=speed VALUE=0.0
  _SET_PRINT_FANS_SPEED

[gcode_macro _SET_PRINT_FANS_SPEED]
description: Apply stored part cooling speed (Normal=active only, COPY/MIRROR=both)
gcode:
  {% set spd  = printer["gcode_macro _PARTFAN_STATE"].speed|float %}
  {% set mode = printer["gcode_macro _IDEX_STATE"].mode|int %}

  # COPY/MIRROR: beide Toolheads gleiche Kühlung
  {% if mode in [1, 2] %}
    SET_FAN_SPEED FAN=partfan_t0 SPEED={spd}
    SET_FAN_SPEED FAN=partfan_t1 SPEED={spd}

  # NORMAL: nur aktives Tool
  {% else %}
    {% if printer.toolhead.extruder == "extruder" %}
      SET_FAN_SPEED FAN=partfan_t0 SPEED={spd}
      SET_FAN_SPEED FAN=partfan_t1 SPEED=0
    {% elif printer.toolhead.extruder == "extruder1" %}
      SET_FAN_SPEED FAN=partfan_t1 SPEED={spd}
      SET_FAN_SPEED FAN=partfan_t0 SPEED=0
    {% else %}
      SET_FAN_SPEED FAN=partfan_t0 SPEED=0
      SET_FAN_SPEED FAN=partfan_t1 SPEED=0
    {% endif %}
  {% endif %}

[gcode_macro IDEX_FAN_DEBUG]
gcode:
  {% set spd  = printer["gcode_macro _PARTFAN_STATE"].speed|float %}
  {% set mode = printer["gcode_macro _IDEX_STATE"].mode|int %}
  RESPOND TYPE=echo MSG="IDEX mode_int={mode} (0=normal,1=copy,2=mirror) | stored_partfan={spd} | active_extruder={printer.toolhead.extruder}"
  
