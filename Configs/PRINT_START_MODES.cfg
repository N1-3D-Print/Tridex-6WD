[gcode_macro PRINT_START_PRIMARY]
gcode:
    RUN_SHELL_COMMAND CMD=set_bett_led_from_filament
    {% set t0 = params.T0_STARTING_TEMP|default(0)|int %}
    {% set t1 = params.T1_STARTING_TEMP|default(0)|int %}
    {% set initial_tool = params.INITIAL_TOOL|default(0)|int %}
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set carto_temp = 150 %}

    # --- Hard reset to PRIMARY mode ---
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder

    # --- Preheat T0 to 150°C for Cartographer probing ---
    # T1 remains off during probing
    M104 S{carto_temp} T0
    M104 S0 T1

    # --- Adaptive Bed Mesh Calibration ---
    SET_VELOCITY_LIMIT ACCEL=10000
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=35
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=15

    # --- Cartographer Touch Homing (T0 @150°C) ---
    M104 S{carto_temp} T0
    M109 S{carto_temp} T0
    CARTOGRAPHER_TOUCH_HOME

    # --- IMPORTANT ---
    # After probing:
    # If T0 is used in the print → heat to target temp
    # If T0 is NOT used → turn it off (0°C)
    {% if t0 > 0 %}
      M104 S{t0} T0
    {% else %}
      M104 S0 T0
    {% endif %}

    # Set T1 target temperature if used
    {% if t1 > 0 %}
      M104 S{t1} T1
    {% endif %}

    # --- Wait for required tool temperatures ---
    {% if t1 > 0 %}
      SET_DUAL_CARRIAGE CARRIAGE=1
      ACTIVATE_EXTRUDER EXTRUDER=extruder1
      M109 S{t1} T1
    {% endif %}

    {% if t0 > 0 %}
      SET_DUAL_CARRIAGE CARRIAGE=0
      ACTIVATE_EXTRUDER EXTRUDER=extruder
      M109 S{t0} T0
    {% endif %}

    # --- Purge routine depending on initial tool ---
    {% set z0 = printer.gcode_move.homing_origin.z|float %}
    {% if initial_tool == 0 %}
      #PURGE_T0
    {% else %}
      #PURGE_T1
    {% endif %}

    # --- Activate correct initial tool ---
    {% if initial_tool == 0 %}
      SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
      ACTIVATE_EXTRUDER EXTRUDER=extruder
      SET_GCODE_OFFSET X=0 Y=0 Z={z0}
    {% else %}
      SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
      ACTIVATE_EXTRUDER EXTRUDER=extruder1
      SET_GCODE_OFFSET X=0 Y=0 Z={z0}
    {% endif %}

    SET_LED_EFFECT EFFECT=LED_Nightrider FADETIME=1.0
    #SKEW_PROFILE LOAD=Califlower

[gcode_macro PRINT_START_COPY]
gcode:
    RUN_SHELL_COMMAND CMD=set_bett_led_from_filament
    {% set t0 = params.T0_STARTING_TEMP|int %}
    {% set t1 = params.T1_STARTING_TEMP|int %}
    {% set carto_temp = 150 %}

    SET_VELOCITY_LIMIT ACCEL=10000
    #SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=35
    BED_MESH_CLEAR
    #BED_MESH_CALIBRATE #ADAPTIVE=1
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=15

    # --- Reset + PRIMARY für Kalibrierung ---
    #M605 S1
    SET_DUAL_CARRIAGE CARRIAGE=x MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=u MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    
    # --- Hotends 150c ---
    M104 S{carto_temp} T0
    M104 S{carto_temp} T1
    
    G28 X
    G1 X125 Y125 F30000
    G28 Z 
    G1 Z5 F30000
    
    #BED_MESH_CLEAR   #Alte Position in Macro
    #BED_MESH_CALIBRATE ADAPTIVE=1   #Alte Position in Macro

    # --- Carto Touch nur T0 ---
    M104 S{carto_temp} T0
    M109 S{carto_temp} T0
    CARTOGRAPHER_TOUCH_HOME #CARTOGRAPHER_TOUCH SAMPLES=2
    #_PARK_TOOL

    # --- Aufheizen beide ---
    M104 S{t0} T0
    M104 S{t1} T1
    M109 S{t0} T0
    #SET_DUAL_CARRIAGE CARRIAGE=1
    #ACTIVATE_EXTRUDER EXTRUDER=extruder1
    M109 S{t1} T1

    # --- COPY aktivieren ---
    ACTIVATE_COPY_MODE

    # --- Purge nur T0 (Copy basiert auf T0) ---
    #PURGE_T0
    SET_LED_EFFECT EFFECT=LED_Nightrider FADETIME=1.0
    SET_GCODE_OFFSET Z=0
    #SKEW_PROFILE LOAD=Califlower

