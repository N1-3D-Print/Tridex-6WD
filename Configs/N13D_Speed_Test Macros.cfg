
[gcode_macro RINGING_TEST_ACCEL]
description: Ringing Test – Accel Tuning Tower
variable_start_accel: 3000
variable_step_delta: 1000
variable_step_height: 5
variable_scv: 10
gcode:
    {% set START_ACCEL = params.START_ACCEL|default(3000)|int %}
    {% set STEP_DELTA  = params.STEP_DELTA|default(1000)|int %}
    {% set STEP_HEIGHT = params.STEP_HEIGHT|default(5)|float %}
    {% set SCV         = params.SCV|default(10)|float %}

    SET_VELOCITY_LIMIT ACCEL={START_ACCEL}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={SCV}

    TUNING_TOWER COMMAND=SET_VELOCITY_LIMIT PARAMETER=ACCEL START={START_ACCEL} STEP_DELTA={STEP_DELTA} STEP_HEIGHT={STEP_HEIGHT}

[gcode_macro TEST_MOTION_ANGLES]
description: Testet XY-Motion von 0° bis 180° mit konfigurierbaren Dynamikwerten und Rücksetzen aller Limits
gcode:
    # Eingabeparameter
    {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|float %}
    {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|float %}
    {% set scv = params.SCV|default(printer.configfile.settings.printer.square_corner_velocity)|float %}
    {% set cruise_ratio = params.CRUISE_RATIO|default(printer.configfile.settings.printer.minimum_cruise_ratio|default(0.05))|float %}
    {% set repeat = params.ITERATIONS|default(5)|int %}
    {% set dist = params.DIST|default(50)|float %}
    {% set distance = dist / 2 %}

    # Originalwerte sichern (aus [printer] Settings)
    {% set old_speed = printer.configfile.settings.printer.max_velocity|float %}
    {% set old_accel = printer.configfile.settings.printer.max_accel|float %}
    {% set old_scv = printer.configfile.settings.printer.square_corner_velocity|float %}
    {% set old_cr = printer.configfile.settings.printer.minimum_cruise_ratio|default(0.05)|float %}

    # Bettmitte berechnen (generic_cartesian: [carriage x] / [carriage y])
    {% set max_x = printer.configfile.settings["carriage x"].position_max|float %}
    {% set max_y = printer.configfile.settings["carriage y"].position_max|float %}
    {% set center_x = max_x / 2 %}
    {% set center_y = max_y / 2 %}

    ; Temporäre Limits setzen
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} SQUARE_CORNER_VELOCITY={scv} MINIMUM_CRUISE_RATIO={cruise_ratio}
    G90

    {% for r in range(repeat) %}
        G1 X{center_x} Y{center_y} F6000

        ; 0°
        G1 X{center_x + distance} Y{center_y} F{speed * 60}
        G1 X{center_x - distance} Y{center_y} F{speed * 60}
        G1 X{center_x} Y{center_y} F{speed * 60}

        ; 30°
        {% set dx = distance * 0.866 %}
        {% set dy = distance * 0.5 %}
        G1 X{center_x + dx} Y{center_y + dy} F{speed * 60}
        G1 X{center_x - dx} Y{center_y - dy} F{speed * 60}
        G1 X{center_x} Y{center_y} F{speed * 60}

        ; 45°
        {% set dx = distance * 0.7071 %}
        {% set dy = distance * 0.7071 %}
        G1 X{center_x + dx} Y{center_y + dy} F{speed * 60}
        G1 X{center_x - dx} Y{center_y - dy} F{speed * 60}
        G1 X{center_x} Y{center_y} F{speed * 60}

        ; 60°
        {% set dx = distance * 0.5 %}
        {% set dy = distance * 0.866 %}
        G1 X{center_x + dx} Y{center_y + dy} F{speed * 60}
        G1 X{center_x - dx} Y{center_y - dy} F{speed * 60}
        G1 X{center_x} Y{center_y} F{speed * 60}

        ; 90°
        G1 X{center_x} Y{center_y + distance} F{speed * 60}
        G1 X{center_x} Y{center_y - distance} F{speed * 60}
        G1 X{center_x} Y{center_y} F{speed * 60}

        ; 120°
        {% set dx = distance * -0.5 %}
        {% set dy = distance * 0.866 %}
        G1 X{center_x + dx} Y{center_y + dy} F{speed * 60}
        G1 X{center_x - dx} Y{center_y - dy} F{speed * 60}
        G1 X{center_x} Y{center_y} F{speed * 60}

        ; 135°
        {% set dx = distance * -0.7071 %}
        {% set dy = distance * 0.7071 %}
        G1 X{center_x + dx} Y{center_y + dy} F{speed * 60}
        G1 X{center_x - dx} Y{center_y - dy} F{speed * 60}
        G1 X{center_x} Y{center_y} F{speed * 60}

        ; 150°
        {% set dx = distance * -0.866 %}
        {% set dy = distance * 0.5 %}
        G1 X{center_x + dx} Y{center_y + dy} F{speed * 60}
        G1 X{center_x - dx} Y{center_y - dy} F{speed * 60}
        G1 X{center_x} Y{center_y} F{speed * 60}

        ; 180°
        G1 X{center_x - distance} Y{center_y} F{speed * 60}
        G1 X{center_x + distance} Y{center_y} F{speed * 60}
        G1 X{center_x} Y{center_y} F{speed * 60}
    {% endfor %}

    ; Originalwerte zurücksetzen
    SET_VELOCITY_LIMIT VELOCITY={old_speed} ACCEL={old_accel} SQUARE_CORNER_VELOCITY={old_scv} MINIMUM_CRUISE_RATIO={old_cr}

    ; Zur Mitte zurück
    G1 X{center_x} Y{center_y} F6000
