[gcode_macro CALIB_CAMERA_KTAMV]
gcode:
  KTAMV_CALIB_CAMERA

[gcode_macro FIND_NOZZLE_CENTER_KTAMV]
gcode:
  KTAMV_FIND_NOZZLE_CENTER

[gcode_macro SET_ORIGIN_KTAMV]
gcode:
  KTAMV_SET_ORIGIN

[gcode_macro MOVE_TO_ORIGIN_KTAMV]
gcode:
  {% if 'xy' not in printer.toolhead.homed_axes%}
      RESPOND PREFIX="info" MSG="Printer not homed."
  {% elif printer.ktamv.camera_center_coordinates[0]|default("none")|lower =="none" %}
      RESPOND PREFIX="info" MSG="Camera center coordinates not set."
  {% else %}
    G0 X{printer.ktamv.camera_center_coordinates[0]} Y{printer.ktamv.camera_center_coordinates[1]}
  {% endif %}

[gcode_macro SIMPLE_NOZZLE_POSITION_KTAMV]
gcode:
  KTAMV_SIMPLE_NOZZLE_POSITION

[gcode_macro GET_OFFSET_KTAMV]
gcode:
  KTAMV_GET_OFFSET
  PRINT_OFFSET_KTAMV

# This is to ilustrate the posibility to access the status variables to get the offset last calculated with GET_OFFSET_KTAMV
[gcode_macro PRINT_OFFSET_KTAMV]
gcode:
  {action_respond_info("Macro example found offset X:"~printer.ktamv.last_calculated_offset[0]~" Y:"~printer.ktamv.last_calculated_offset[1])}

[gcode_macro SEND_SERVER_CFG_KTAMV]
gcode:
  KTAMV_SEND_SERVER_CFG

[gcode_macro STOP_PREVIEW_KTAMV]
gcode:
  KTAMV_STOP_PREVIEW

[gcode_macro START_PREVIEW_KTAMV]
gcode:
  KTAMV_START_PREVIEW

[gcode_macro TOOL_ALIGN_MACRO]
description: Aligns IDEX tools using KTAMV (camera center supports X/Y/Z)
gcode:
    # ---------------------------
    # User constants (edit here)
    # ---------------------------
    {% set VAR_CAMERA_CENTER = {'x': 175.0, 'y': 20.0, 'z': 0.0} %}   # Camera center position X/Y/Z
    {% set VAR_TOOL_TO_USE_FOR_CALIBRATION = 0 %}                    # Tool used to calibrate camera
    {% set VAR_TOOL_TO_USE_AS_REFERENCE   = 0 %}                     # Reference tool for offsets (usually T0)
    {% set VAR_TOOLS_TO_ALIGN             = [1] %}                   # Tools to align (IDEX: usually [1])
    {% set VAR_REQUIRE_Z_HOMED = True %}                             # Require Z homed because we move to Z

    # ---------------------------
    # Safety / pre-checks
    # ---------------------------
    {% set homed = printer.toolhead.homed_axes|string|lower %}

    {% if ('x' not in homed) or ('y' not in homed) %}
        RESPOND PREFIX="info" MSG="TOOL_ALIGN_MACRO: Printer not homed (XY required)."
    {% elif VAR_REQUIRE_Z_HOMED and ('z' not in homed) %}
        RESPOND PREFIX="info" MSG="TOOL_ALIGN_MACRO: Printer not homed (Z required because camera center includes Z)."
    {% else %}

        # ---------------------------
        # Calibrate camera / set origin if needed
        # ---------------------------
        {% set cam_ok = printer.ktamv.camera_center_coordinates[0]|default("none")|lower != "none" %}
        {% set mpp_ok = printer.ktamv.mm_per_pixels|default("none")|lower != "none" %}

        {% if (not cam_ok) or (not mpp_ok) %}
            # Push server config (KTAMV)
            KTAMV_SEND_SERVER_CFG

            # Tool for camera calibration
            T{VAR_TOOL_TO_USE_FOR_CALIBRATION}

            # Move to configured camera center (X/Y/Z)
            G0 X{VAR_CAMERA_CENTER.x} Y{VAR_CAMERA_CENTER.y} Z{VAR_CAMERA_CENTER.z} F{printer.ktamv.travel_speed}
            M400

            # Calibrate the camera
            KTAMV_CALIB_CAMERA

            # Load reference tool and set origin
            T{VAR_TOOL_TO_USE_AS_REFERENCE}
            G0 X{VAR_CAMERA_CENTER.x} Y{VAR_CAMERA_CENTER.y} Z{VAR_CAMERA_CENTER.z} F{printer.ktamv.travel_speed}
            KTAMV_FIND_NOZZLE_CENTER
            _TOOL_ALIGN_MACRO_SET_ORIGIN_IF_SUCCESSFUL
        {% endif %}

        # ---------------------------
        # Align tools
        # ---------------------------
        {% for tool in VAR_TOOLS_TO_ALIGN %}
            RESPOND PREFIX="info" MSG="- Aligning tool T{tool}"
            _TOOL_ALIGN_MACRO_ALIGN_TOOL TOOL={tool} X={VAR_CAMERA_CENTER.x} Y={VAR_CAMERA_CENTER.y} Z={VAR_CAMERA_CENTER.z}
        {% endfor %}

    {% endif %}


[gcode_macro _TOOL_ALIGN_MACRO_SET_ORIGIN_IF_SUCCESSFUL]
description: Helper - sets KTAMV origin if last nozzle center was successful
gcode:
    {% if printer.ktamv.last_nozzle_center_successful|default("false")|lower == "true" %}
        KTAMV_SET_ORIGIN
        RESPOND PREFIX="info" MSG="KTAMV origin set."
    {% else %}
        RESPOND PREFIX="info" MSG="KTAMV nozzle center failed - origin NOT set."
    {% endif %}


[gcode_macro _TOOL_ALIGN_MACRO_ALIGN_TOOL]
description: Helper - align a single tool (moves to camera center X/Y/Z)
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set X = params.X|float %}
    {% set Y = params.Y|float %}
    {% set Z = params.Z|float %}

    {% set homed = printer.toolhead.homed_axes|string|lower %}

    {% set cam_ok = printer.ktamv.camera_center_coordinates[0]|default("none")|lower != "none" %}
    {% set mpp_ok = printer.ktamv.mm_per_pixels|default("none")|lower != "none" %}

    {% if cam_ok and mpp_ok and ('x' in homed) and ('y' in homed) %}
        RESPOND PREFIX="info" MSG="Aligning tool T{TOOL}"

        # Load tool (IDEX: T0/T1)
        T{TOOL}

        # Move to camera center X/Y/Z (Z only if homed)
        {% if 'z' in homed %}
            G0 X{X} Y{Y} Z{Z} F{printer.ktamv.travel_speed}
        {% else %}
            G0 X{X} Y{Y} F{printer.ktamv.travel_speed}
        {% endif %}

        M400

        # Find nozzle center and compute offset
        KTAMV_FIND_NOZZLE_CENTER
        KTAMV_GET_OFFSET

        # Save/report + trigger your own offset saving pipeline
        _TOOL_ALIGN_MACRO_SAVE_OFFSET TOOL={TOOL}
    {% else %}
        RESPOND PREFIX="info" MSG="Camera not calibrated / origin not set / XY not homed. Run TOOL_ALIGN_MACRO again."
    {% endif %}


[gcode_macro _TOOL_ALIGN_MACRO_SAVE_OFFSET]
description: Helper - report last calculated offset and store via GET_LAST_OFFSET
gcode:
    {% set TOOL = params.TOOL|int %}
    {% if printer.ktamv.last_nozzle_center_successful|default("false")|lower == "true" %}
        {action_respond_info(
            "KTAMV offset for T" ~ TOOL ~
            " -> X:" ~ printer.ktamv.last_calculated_offset[0] ~
            " Y:" ~ printer.ktamv.last_calculated_offset[1]
        )}

        # Store offsets (your existing pipeline)
        GET_LAST_OFFSET

    {% else %}
        RESPOND PREFIX="info" MSG="Nozzle center failed - offset not saved for T{TOOL}."
    {% endif %}


# Your existing macro (fixed so X is actually defined)
[gcode_macro GET_LAST_OFFSET]
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}

    # --- Prefer tools_calibrate if available, otherwise use KTAMV ---
    {% if printer.tools_calibrate is defined %}
        {% set new_offset_x = printer.tools_calibrate.last_x_result|float|round(6) %}
        {% set new_offset_y = printer.tools_calibrate.last_y_result|float|round(6) %}
        {% set new_offset_z = printer.tools_calibrate.last_z_result|float|round(6) %}
        RESPOND MSG="Fetched (tools_calibrate): X={new_offset_x}, Y={new_offset_y}, Z={new_offset_z}"

    {% elif printer.ktamv is defined %}
        {% set new_offset_x = printer.ktamv.last_calculated_offset[0]|float|round(6) %}
        {% set new_offset_y = printer.ktamv.last_calculated_offset[1]|float|round(6) %}
        # KTAMV is 2D -> no Z available. Keep existing DC_VARS offset_z (or set 0.0).
        {% set new_offset_z = (dcvars.offset_z|default(0.0))|float|round(6) %}
        RESPOND MSG="Fetched (KTAMV): X={new_offset_x}, Y={new_offset_y}, Z={new_offset_z} (Z unchanged)"

    {% else %}
        RESPOND PREFIX="error" MSG="GET_LAST_OFFSET: Neither tools_calibrate nor ktamv is available."
        {% set new_offset_x = (dcvars.offset_x|default(0.0))|float %}
        {% set new_offset_y = (dcvars.offset_y|default(0.0))|float %}
        {% set new_offset_z = (dcvars.offset_z|default(0.0))|float %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=offset_x VALUE={new_offset_x}
    SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=offset_y VALUE={new_offset_y}
    SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=offset_z VALUE={new_offset_z}
    SAVE_OFFSETS_TO_DISK